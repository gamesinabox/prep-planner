<style>
/* Layout: single column phone app, fixed bottom tab bar, cards only for recipes. System fonts on purpose: it must work offline. */
:root{
  --bg:#f3f6f4;--surface:#ffffff;--fg:#16201c;--muted:#5a6a63;--line:#d9e2dd;
  --accent:#1f6b4f;--accent-ink:#ffffff;--accent-soft:#e2efe9;
  --ok:#2c7a46;--warn:#9a5b00;--bad:#b3261e;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1412;--surface:#17201c;--fg:#e4ebe7;--muted:#98a9a1;--line:#2a3631;
  --accent:#5cc49a;--accent-ink:#06130d;--accent-soft:#1b2e26;
  --ok:#6fcf8f;--warn:#f0b44c;--bad:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1412;--surface:#17201c;--fg:#e4ebe7;--muted:#98a9a1;--line:#2a3631;
  --accent:#5cc49a;--accent-ink:#06130d;--accent-soft:#1b2e26;
  --ok:#6fcf8f;--warn:#f0b44c;--bad:#ff8a80;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--font);-webkit-text-size-adjust:100%}
main{max-width:720px;margin:0 auto;padding-block:12px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:22px;margin:4px 0 2px;letter-spacing:-.01em}
h2{font-size:18px;margin:22px 0 8px;text-wrap:balance}
h3{font-size:16px;margin:0}
h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 4px}
p{margin:6px 0}
.sub{color:var(--muted);font-size:13px;margin:0 0 10px}
.num,table,.macros{font-variant-numeric:tabular-nums}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav button{appearance:none;border:0;background:none;color:var(--muted);font:600 13px var(--font);padding:12px 0 14px;cursor:pointer}
nav button[aria-current="page"]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
nav button:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.field{display:grid;gap:4px;margin:14px 0 0}
.field>span{font-weight:600}
select,input{width:100%;font:16px var(--font);padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.hint{font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:600 14px var(--font);padding:10px 14px;border-radius:8px;cursor:pointer}
.btn.ghost{background:none;color:var(--accent)}
.switch{display:flex;gap:10px;align-items:center;margin-top:14px;font-weight:600}
.switch input{width:22px;height:22px;accent-color:var(--accent)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right;white-space:nowrap}
.shop{list-style:none;padding:0;margin:0}
.shop li{border-bottom:1px solid var(--line)}
.shop label{display:grid;grid-template-columns:28px 1fr auto;gap:8px;padding:10px 0;align-items:start;cursor:pointer}
.shop input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent)}
.shop input:checked~span{text-decoration:line-through;color:var(--muted)}
.shop small{display:block;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.card ul,.card ol{margin:4px 0;padding-left:20px}
.card li{margin:3px 0}
.meta{color:var(--muted);font-size:13px;margin:2px 0 0}
.macros{font-weight:600;color:var(--accent);margin-top:8px}
.portion{background:var(--accent-soft);border-radius:8px;padding:8px 10px;margin-top:10px}
.note{font-size:13px;color:var(--muted)}
.step{border-left:3px solid var(--accent);padding:2px 0 2px 10px;margin:10px 0}
.chooser{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font:inherit;cursor:pointer}
.chooser b,.opt b{display:block;font-size:15px;font-weight:600}
.chooser small,.opt small{display:block;color:var(--muted);font-size:13px;margin-top:2px;font-variant-numeric:tabular-nums}
.chev{font-size:26px;line-height:1;color:var(--muted);padding-right:4px}
.field .hint{margin:2px 0 0}
#picker{padding:0;border:0;width:100%;max-width:720px;height:100%;max-height:100%;margin:0 auto;background:var(--bg);color:var(--fg)}
#picker::backdrop{background:rgba(0,0,0,.45)}
#picker header{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
#picker header h2{margin:0;font-size:17px}
#picker .opts{padding:0 max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.opt{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:none;color:var(--fg);font:inherit;cursor:pointer}
.opt .thumb{width:96px;height:96px}
.opt.on b{color:var(--accent)}
.tick{color:var(--accent);font-size:20px;font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.thumb{width:64px;height:64px;object-fit:cover;border-radius:8px;flex:none;background:var(--line)}
.hero{margin:-14px -14px 12px}
.hero img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px 12px 0 0;background:var(--line)}
.hero figcaption{font-size:11px;color:var(--muted);padding:4px 14px 0}
.wform{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.wform .field{margin:0}
.chart{width:100%;height:auto;display:block;margin-top:12px}
.chart text{font:11px var(--font);fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .goal{stroke:var(--ok);stroke-width:1.5;stroke-dasharray:5 4}
.chart .goaltxt{fill:var(--ok)}
.chart .dot{fill:var(--muted);opacity:.6}
.chart .avg{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
.entries{list-style:none;padding:0;margin:0}
.entries li{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.entries .btn{padding:6px 10px;font-size:13px}
.price{display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.price input{padding:6px 8px;text-align:right}
@media print{nav,.noprint{display:none!important}main{padding:0}.card{break-inside:avoid;border-color:#999}body{background:#fff;color:#000}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</nav>

 {id:4,n:'Pesto chicken and chickpea pasta',s:4,min:30,src:['Heart Foundation','https://www.heartfoundation.org.au/recipes/pesto-chicken-chickpea-pasta'],
  ing:{pasta:250,oil:10,chicken:800,chickpeas:240,tomato:200,garlic:5,cornflour:6,evap:375,pesto:20,spinach:100},
  m:['Cook the pasta until al dente. Drain.','Brown the diced chicken in the oil in a large non-stick pan, 3–4 min.','Add chickpeas, halved cherry tomatoes and garlic; cook 2 min.','Mix the cornflour with 250 ml salt-reduced chicken stock. Add with the evaporated milk, pesto and 2 tsp Dijon mustard. Bring to the boil, then simmer 3 min until thick and the chicken is cooked.','Stir in the spinach until wilted. Serve with the pasta.'],
  note:'Changed: chicken 400 g → 800 g, pasta 170 g → 250 g, cherry tomatoes instead of sundried tomato strips.'},
 {id:5,n:'Chicken chow mein',s:4,min:25,src:['RecipeTin Eats','https://www.recipetineats.com/chicken-chow-mein/'],
  ing:{chicken:800,cabbage:560,oil:30,garlic:10,noodles:280,carrot:150,cornflour:8,soy:50,oyster:50,sugar:8},
  m:['Sauce: mix the cornflour into the soy, then add oyster sauce, 3 tbsp Chinese cooking wine or water, sugar, a few drops of sesame oil and white pepper.','Toss the sliced chicken with 2 tbsp of the sauce; leave 10 min.','Prepare the noodles following the packet. Drain.','Heat the oil in a wok on high. Fry the garlic 10 sec, then the chicken until browned outside.','Add shredded cabbage, carrot and spring onion whites; stir-fry 1½ min.','Add noodles, the rest of the sauce and 125 ml water. Toss 1–2 min until the chicken is cooked through.'],
  note:'Changed: source serves 2; this is doubled with chicken 400 g → 800 g. Bean sprouts optional, not counted.'},
 {id:6,n:'Chicken curry',s:4,min:30,src:['RecipeTin Eats','https://www.recipetineats.com/chicken-curry/'],
  ing:{oil:20,garlic:6,ginger:10,onion:100,chicken:800,curry:20,coconut:400,peas:160,rice:240},
  m:['Cook the rice.','Heat the oil and cook garlic, ginger and onion 3 min until soft.','Add the sliced chicken and cook until it turns white. Add the curry powder and cook 2 min.','Add the coconut milk and 375 ml low-salt chicken stock. Simmer briskly 10 min until thickened.','Add the peas and salt; cook 2 min. Divide with the rice.'],
  note:'Changed: breast instead of thigh, 500 g → 800 g; light coconut milk instead of full-fat.'},
 {id:7,n:'Smokey bean and beef burrito bowls',s:4,min:30,src:['Heart Foundation','https://www.heartfoundation.org.au/recipes/smokey-bean-and-beef-burrito-bowl'],
  ing:{rump:800,spice:8,sugar:4,oil:5,cabbage:400,carrot:300,beansBlack:240,tomato:200,cucumber:300,avocado:140,yoghurt:80,rice:240},
  m:['Mix smoked paprika, cumin, chilli powder and brown sugar. Rub over the steak and spray with oil.','Cook the rice.','Grill the steak on a hot chargrill or pan 2–3 min a side. Rest 5 min, then slice thinly.','Toss shredded cabbage, grated carrot and coriander as a slaw.','Divide rice, slaw, kidney beans, cherry tomatoes, cucumber and beef. Add avocado and a spoon of yoghurt on the day.'],
  note:'Changed: steak 400 g → 800 g, rice added so it fills you up.'},
 {id:8,n:'Spaghetti bolognese',s:4,min:40,src:['RecipeTin Eats','https://www.recipetineats.com/spaghetti-bolognese/'],
  ing:{oil:15,garlic:6,onion:150,beef:800,dicedtom:800,tompaste:40,sugar:8,spice:2,pasta:280},
  m:['Cook the onion and garlic in the oil 3 min until golden.','Turn the heat up, add the mince and break it up until browned.','Add 125 ml red wine or water and scrape the pan for 1 min.','Add crushed tomatoes, tomato paste, 2 crumbled beef stock cubes, sugar, 2 tsp Worcestershire, bay leaves, thyme, salt and pepper. Simmer gently 20–30 min, uncovered, adding water if it gets too thick.','Cook the pasta 1 min short of the packet time. Toss with the sauce and a splash of pasta water for 2 min.'],
  note:'Changed: 5% fat beef raised from 500 g to 800 g, oil cut from 1½ tbsp to 1, parmesan not counted.'},
 {id:9,n:'Chilli con carne with rice',s:4,min:45,src:['RecipeTin Eats','https://www.recipetineats.com/chilli-con-carne/'],
  ing:{oil:15,garlic:9,onion:150,capsicum:200,beef:800,tompaste:60,dicedtom:800,beansBlack:240,sugar:6,spice:40,rice:240},
  m:['Cook the rice.','Cook garlic and onion in the oil 1 min, add the diced capsicum for 2 min.','Turn the heat up, add the mince and break it up.','Add the spice mix (cayenne, paprika, cumin, garlic and onion powder, oregano) and cook until the beef is browned all over.','Add tomato paste, crushed tomatoes, drained kidney beans, 2 crumbled stock cubes, sugar, salt and 125 ml water. Simmer gently 20–40 min, uncovered.'],
  note:'Changed: beef raised from 500 g to 800 g. Serve toppings like sour cream and cheese are not counted.'},
 {id:10,n:'Beef rissoles with sweet potato mash',s:4,min:45,src:['Heart Foundation','https://www.heartfoundation.org.au/recipes/vegeful-beef-rissoles-with-sweet-potato-mash'],
  ing:{beef:800,onion:100,carrot:80,zucchini:120,crumbs:50,cheddar:30,chutney:40,spice:4,egg:1,oil:18,broccoli:350,sweetpot:800,potato:300,milk:40},
  m:['Mix mince, onion, grated carrot and zucchini, breadcrumbs, grated parmesan (or cheddar), chutney, dried herbs, egg and pepper. Shape 16 patties.','Cook in the oil in two batches, about 5 min a side, until browned and cooked through.','Boil the sweet potato and potato about 20 min until tender. Drain and mash with the milk.','Steam or microwave the broccolini.','Divide rissoles, mash and greens. Extra chutney to serve is not counted.'],
  note:'Changed: beef 500 g → 800 g, mash doubled.'},
 {id:11,n:'Italian meatball pasta with green salad',s:4,min:40,src:['Heart Foundation','https://www.heartfoundation.org.au/recipes/italian-meatball-pasta-with-green-salad'],
  ing:{beef:800,egg:1,garlic:6,spice:1,oil:5,onion:200,carrot:200,tomato:680,dicedtom:400,pasta:280,spinach:120,cucumber:150},
  m:['Mix the mince, egg, chopped parsley, garlic and pepper. Roll tablespoons into balls.','Brown the meatballs in a sprayed non-stick pan, 4–5 min. Take them out.','Soften the onion and diced carrot 1–2 min. Add chopped fresh tomatoes, tinned tomatoes and the meatballs; simmer 10–15 min until cooked through. Stir in basil.','Cook the spaghetti until al dente.','Pack the salad (spinach, cucumber, red onion, cherry tomatoes) separately.'],
  note:'Changed: beef 400 g → 800 g, pasta 300 g → 280 g.'},
 {id:12,n:'Smashed beef kofta with cucumber yoghurt',s:4,min:25,src:['RecipeTin Eats','https://www.recipetineats.com/smashed-beef-kofta-with-cucumber-yogurt-sauce/'],
  ing:{oil:15,beef:800,onion:200,spice:15,walnuts:30,cucumber:250,yoghurt:375,pita:280},
  m:['Grate the cucumber into the yoghurt, add sliced mint and salt.','Grate the onion and mix with the mince, cumin, coriander, paprika, cinnamon, a pinch of cayenne and salt.','Heat the oil in a large non-stick pan. Drop in rough 2–3 cm lumps of beef and leave 5–7 min until dark golden underneath.','Flip as best you can, add the walnuts and cook 1–2 min more until cooked through.','Pack beef with the yoghurt sauce and a warm pita each. A drizzle of pomegranate molasses or balsamic glaze is optional.'],
  note:'Changed: beef 500 g → 800 g (5% fat), non-fat Greek yoghurt instead of full-fat, cranberries left out.'},
 {id:13,n:'Turkey and lentil kofta with roast veg',s:4,min:45,src:['Heart Foundation','https://www.heartfoundation.org.au/recipes/turkey-and-lentil-kofta'],
  ing:{turkey:800,lentils:400,feta_rf:160,spice:15,garlic:10,oil:15,sweetpot:1000,zucchini:300,capsicum:200},
  m:['Heat the oven to 220°C. Toss diced sweet potato, zucchini and capsicum with the oil on a large tray. Roast 30–35 min.','Coarsely mash the lentils. Mix in the turkey, crumbled feta, oregano, allspice, garlic and pepper.','Shape about 32 oval kofta and bake on a lined tray 18–22 min until the centre reaches 74°C.','Divide veg and kofta.'],
  note:'Changed: source is a 1 kg base batch for later meals; this uses 800 g turkey, and the veg tray matches its follow-up tray bake.'},
 {id:14,n:'Honey soy meatball bake',s:4,min:45,src:['Heart Foundation','https://www.heartfoundation.org.au/recipes/one-pan-honey-soy-meatball-bake'],
  ing:{bread:60,milk:80,egg:1,beef:800,ginger:6,garlic:6,carrot:300,capsicum:200,broccoli:300,rice:240,honey:40,soy:20,oil:5},
  m:['Soak the torn bread in the milk 5 min, then beat in the egg.','Mix in the mince, ginger, garlic and pepper. Roll heaped tablespoons into balls.','Spray a roasting pan with oil. Bake the meatballs and carrot batons at 200°C for 15 min. Cook the rice.','Whisk honey, soy and 1 tbsp boiling water. Add capsicum to the pan, pour over the glaze, toss. Bake at 220°C another 15–20 min until cooked through.','Steam the broccolini and add. Divide with the rice.'],
  note:'Changed: beef 500 g → 800 g, rice 2 cups cooked → 240 g dry.'},
 {id:15,n:'One-pan sausage and lentils',s:4,min:60,src:['RecipeTin Eats','https://www.recipetineats.com/one-pan-baked-sausage-and-lentils/'],
  ing:{oil:20,onion:120,garlic:9,spice:6,lentilsDry:285,carrot:250,sausage:680},
  m:['Heat the oven to 200°C (180°C fan).','In a metal roasting pan on the stove, sauté sliced shallots and garlic in the oil 3 min. Add cumin seeds for 1 min.','Add the dried lentils, diced carrot, salt, pepper and 750 ml low-salt chicken stock. Bring to a simmer.','Sit the sausages on top. Cover with baking paper pressed onto the stock.','Bake 25 min, uncover and bake 20 min more to brown the sausages. Rest 5 min.'],
  note:'Changed: oil cut from 3 tbsp to about 1. Lower protein than most; sausages vary, check the label.'},
 {id:16,n:'Veggie-ful tuna pasta bake',s:4,min:50,src:['Heart Foundation','https://www.heartfoundation.org.au/recipes/veggie-ful-tuna-pasta-bake'],
  ing:{oil:18,onion:150,garlic:5,carrot:300,mushrooms:150,tompaste:140,dicedtom:400,spice:4,zucchini:280,pasta:280,tuna:600,bocconcini:120},
  m:['Cook onion and garlic in the oil 3–5 min. Add grated carrot and chopped mushrooms; cook 10 min.','Stir in the tomato paste 1 min, then the tomatoes, 250 ml water, a salt-reduced stock cube and oregano. Simmer 8–10 min until thick. Stir in grated zucchini and basil.','Cook the pasta until al dente.','Mix pasta, sauce and drained tuna in a baking dish. Top with torn bocconcini.','Bake at 200°C for 20–25 min until golden.'],
  note:'Changed: tuna doubled to two 425 g tins, pasta 250 g → 280 g.'},
 {id:17,n:'Salmon and rice bowls',s:4,min:25,src:['Heart Foundation','https://www.heartfoundation.org.au/recipes/salmon-rice-lunch-bowl'],
  ing:{salmon:800,rice:240,edamame:200,avocado:140,soy:30,lemon:30,oil:5},
  m:['Cook the rice. Cook the edamame following the packet, rinse in cold water.','Grill, bake (200°C, 12–15 min) or air-fry the salmon until just cooked through. Flake.','Dressing: soy, lime juice, crushed chilli and a few drops of sesame oil.','Divide rice, edamame and salmon. Keep the dressing separate.','Add avocado, seaweed and sesame seeds on the day.'],
  note:'Changed: source is one small lunch (100 g raw salmon); this makes 4 big bowls with 200 g each.'},
 {id:18,n:'Pumpkin and tofu satay',s:4,min:30,src:['Heart Foundation','https://www.heartfoundation.org.au/recipes/pumpkin-and-tofu-satay'],
  ing:{pumpkin:600,tofu:600,oil:15,onion:150,curry:9,evap:250,pb:65,soy:40,greenbeans:200,rice:240},
  m:['Cook the rice. Steam or microwave the pumpkin chunks until almost tender.','Pat the tofu strips dry. Fry tofu and onion wedges in the oil about 4 min until golden.','Add pumpkin and curry powder; stir 1 min.','Add evaporated milk, peanut butter, soy and 180 ml water. Bring to the boil.','Add the green beans and boil gently 3–4 min until tender and thick. Stir in coriander. Divide with rice.'],
  note:'Changed: tofu raised from 175 g to 600 g so it has enough protein.'},
 {id:19,n:'Honey soy tofu noodle stir-fry',s:4,min:20,src:['Heart Foundation','https://www.heartfoundation.org.au/recipes/step-by-step/honey-soy-tofu-noodle-stir-fry'],
  ing:{noodles:270,oil:18,stirfry:600,garlic:6,edamame:300,tofu:600,cashews:45,honey:40,soy:40},
  m:['Cook the noodles following the packet. Drain.','Heat the oil in a wok on high. Stir-fry the vegetables and garlic 1 min.','Add edamame and sliced tofu; stir-fry 2 min.','Add the noodles and half the cashews; toss until hot.','Add honey and soy and toss to coat. Top with the rest of the cashews.'],
  note:'Changed: plain firm tofu 600 g with extra honey and soy instead of 200 g honey-soy tofu; edamame and veg raised; wheat noodles instead of soba.'},
 {id:20,n:'Chicken fried rice',s:4,min:25,src:['RecipeTin Eats','https://www.recipetineats.com/chicken-fried-rice/'],
  ing:{oil:20,egg:4,chicken:700,garlic:6,onion:75,carrot:100,corn:80,peas:80,rice:240,soy:45,oyster:15},
  m:['Cook the rice and spread it out to cool quickly; day-old rice in the fridge is ideal.','Mix the soy, oyster sauce, 2 tbsp Chinese cooking wine, sesame oil and white pepper. Toss 2 tsp through the sliced chicken.','Scramble the eggs in 1 tbsp oil until just set. Take out.','On high heat, cook onion and garlic in the rest of the oil, then the carrot, corn and peas 1 min, then the chicken until white.','Add rice and sauce; stir-fry 1½ min. Toss the egg and spring onion through.'],
  note:'Changed: chicken 150 g → 700 g and eggs 2 → 4 to make it a main; bacon left out.'},
 {id:21,n:'Grilled chicken salad bowl with tahini',s:1,min:20,src:['Heart Foundation','https://www.heartfoundation.org.au/recipes/grilled-chicken-salad-bowl-with-tahini-dressing'],
  ing:{tahini:10,garlic:2,lemon:10,oil:4,honey:2,chicken:220,lentils:100,beetroot:80,carrot:100,cucumber:100,spinach:30},
  m:['Mix tahini, garlic, lemon, oil, honey and 1 tsp hot water until smooth.','Halve the chicken breast horizontally and cook in a sprayed pan 5–6 min a side until cooked through. Slice.','Fill a bowl with lentils, grated beetroot and carrot, cucumber batons and spinach. Add chicken and dressing.'],
  note:'Changed: one big bowl with 220 g chicken and double lentils.'},
 {id:22,n:'Greek tuna rice salad',s:1,min:15,src:['Heart Foundation','https://www.heartfoundation.org.au/recipes/greek-tuna-salad-jars'],
  ing:{rice:60,oil:7,lemon:7,feta:25,tuna:200,capsicum:75,cucumber:70,tomato:60,lettuce:60},
  m:['Cook the rice and cool it.','Mix oil, lemon and crumbled feta in the bottom of a bowl or jar. Add the tuna, then the rice.','Top with chopped capsicum, cucumber, cherry tomatoes, spring onion, dill and lettuce. Olives and pine nuts optional, not counted.'],
  note:'Changed: one big serve with 200 g tuna; plain rice instead of microwave rice blend.'},
 {id:23,n:'Mexican avocado chicken salad',s:1,min:25,src:['RecipeTin Eats','https://www.recipetineats.com/mexican-chicken-avocado-salad/'],
  ing:{lemon:10,honey:7,oil:10,garlic:2,chicken:220,spice:2,avocado:60,tomato:100,corn:60,onion:25,lettuce:100},
  m:['Shake lime juice, honey, half the oil, garlic, salt and pepper in a jar.','Coat the chicken with 2 tsp of the dressing, chipotle, oregano and cumin.','Cook in the rest of the oil over medium-low about 8 min until browned and cooked through. Rest 5 min, slice.','Toss avocado, corn, cherry tomatoes, red onion and coriander with a little dressing.','Pile cos lettuce, salsa and chicken; drizzle the rest of the dressing.'],
  note:'Changed: one big serve with 220 g chicken; oil cut from ¼ cup for 3 people to 2 tsp.'},
 {id:24,n:'Chilli lime salmon with potatoes and beans',s:1,min:40,src:['RecipeTin Eats','https://www.recipetineats.com/oven-baked-honey-chili-lime-salmon-with-potatoes-and-beans-one-tray-meal/'],
  ing:{salmon:200,lemon:15,honey:10,soy:7,garlic:2,potato:300,oil:5,greenbeans:150},
  m:['Heat the oven to 180°C with a tray inside. Marinate the salmon in lime zest and juice, honey, soy and garlic.','Toss halved baby potatoes in the oil and salt; roast on the hot tray 20 min.','Move the potatoes aside, add the salmon and green beans. Drizzle marinade on the salmon.','Bake about 5 min per 1.5 cm of salmon thickness, then grill 2 min with the rest of the marinade.','Grate chilli and lime zest over to serve.'],
  note:'Changed: one big serve; olive oil instead of butter; potatoes and beans raised.'},
 {id:25,n:'Asian tofu rice salad',s:1,min:25,src:['Heart Foundation','https://www.heartfoundation.org.au/recipes/asian-tofu-rice-salad'],
  ing:{tofu:200,oil:5,rice:40,cabbage:150,carrot:60,edamame:80,peanuts:10,soy:10,honey:5},
  m:['Pat the tofu strips dry. Fry in the oil over medium heat about 8 min, turning, until golden. Cool.','Dressing: soy, rice vinegar, honey and a few drops of sesame oil.','Toss tofu with cooked rice, shredded wombok, carrot, edamame, spring onion, coriander and chopped peanuts. Add the dressing.'],
  note:'Changed: one big serve with 200 g tofu; edamame instead of snow peas for extra protein.'},
 // 26–35: published recipes scaled up to 800 g meat for 4 big portions. Methods are paraphrased; see src for the original.
 {id:26,n:'Tandoori chicken tray bake',s:4,min:55,src:['Heart Foundation','https://www.heartfoundation.org.au/recipes/tandoori-chicken-tray-bake'],
  ing:{chicken:800,tandoori:40,yoghurt:90,sweetpot:1000,cauli:500,onion:150,oil:18,zucchini:500,capsicum:200},
  m:['Heat the oven to 220°C (200°C fan).','Cut a few slashes in each chicken breast. Coat with the tandoori paste mixed with 2 tbsp of the yoghurt and chill while the veg starts.','Toss 2 cm sweet potato cubes, cauliflower florets and onion wedges with half the oil on a large tray (two if crowded). Roast 20 min.','Turn the veg, add zucchini and capsicum, sit the chicken on top and drizzle the rest of the oil. Roast 20–25 min until the chicken reaches 74°C.','Thin the remaining yoghurt with a little water. Keep it in small pots and add after reheating.'],
  note:'Source: sweet potato raised from 700 g to 1 kg.'},
 {id:27,n:'One-pan Mexican chicken',s:4,min:30,src:['Heart Foundation','https://www.heartfoundation.org.au/recipes/one-pan-mexican-chicken-with-tortilla-crisps'],
  ing:{chicken:800,spice:10,garlic:5,oil:18,tompaste:40,dicedtom:400,beansBlack:240,cheddar:80,rice:240,lettuce:200,tomato:200},
  m:['Cook the rice.','Slice each chicken breast in half horizontally into thin steaks. Coat in smoked paprika, cumin, ground coriander, garlic and the oil.','Brown the chicken in a large non-stick ovenproof pan, 2–3 min a side. Set aside.','Stir the tomato paste in the pan for 30 sec. Add tinned tomatoes, beans and about 180 ml water and bring to the boil.','Return the chicken and simmer uncovered about 5 min until cooked through. Top with cheese and grill 2 min until melted.','Divide with the rice. Pack lettuce and tomato separately.'],
  note:'Source: chicken raised from 600 g to 800 g; rice instead of tortilla crisps.'},
 {id:28,n:'Taco chicken bowls',s:4,min:25,src:['Heart Foundation','https://www.heartfoundation.org.au/recipes/taco-chicken-bowls'],
  ing:{oil:5,onion:120,chickmince:800,spice:8,dicedtom:400,rice:240,lettuce:300,capsicum:200,beansBlack:240,avocado:140,feta_rf:60},
  m:['Cook the rice.','Soften the finely chopped onion in the oil, then brown the chicken mince, breaking it up.','Stir in Mexican chilli powder and the tinned tomatoes. Simmer until thick.','Divide mince and rice into containers. Pack lettuce, capsicum, beans and feta separately. Cut the avocado on the day so it does not brown.'],
  note:'Source: mince raised from 500 g to 800 g; dry rice instead of microwave rice cups.'},
 {id:29,n:'Greek-style beef bowls',s:4,min:30,src:['Heart Foundation','https://www.heartfoundation.org.au/recipes/step-by-step/greek-style-beef-bowl'],
  ing:{sweetpot:1000,oil:18,spice:6,beef:800,onion:150,passata:250,honey:42,capsicum:200,avocado:140,cottage:300},
  m:['Heat the oven to 200°C. Toss 1 cm sweet potato cubes with half the oil and a little oregano and cinnamon. Roast about 20 min.','Brown the mince and onion in the rest of the oil, 6–8 min.','Add the passata, 125 ml water and the rest of the oregano and cinnamon. Simmer 10 min until thick.','Warm the honey with a pinch of chilli flakes until it bubbles.','Portion beef and sweet potato. Pack capsicum and cottage cheese separately, cut the avocado on the day and drizzle the hot honey to serve.'],
  note:'Source: beef raised from 500 g to 800 g, sweet potato doubled, cottage cheese from 200 g to 300 g.'},
 {id:30,n:'Tikka meatball curry',s:4,min:45,src:['Heart Foundation','https://www.heartfoundation.org.au/recipes/tikka-meatball-curry'],
  ing:{beef:800,garlic:5,crumbs:55,carrot:130,egg:1,onion:150,curryp:40,cornflour:9,evap:375,peas:200,spinach:100,rice:240,oil:5},
  m:['Mix the mince, garlic, breadcrumbs, grated carrot, egg and pepper. Roll about 24 balls.','Brown the meatballs in the oil in a large non-stick pan, turning, until cooked through. Set aside.','Cook the sliced onion with the tikka paste and a splash of water until soft.','Mix the cornflour with a little of the evaporated milk, then stir it in with the rest of the milk and bring to the boil.','Return the meatballs, add the peas and simmer until the sauce thickens. Stir in the spinach until wilted.','Cook the rice and divide.'],
  note:'Source: beef raised from 500 g to 800 g; dry rice instead of microwave rice cups.'},
 {id:31,n:'Qeema curried beef with peas',s:4,min:25,src:['RecipeTin Eats','https://www.recipetineats.com/qeema-indian-curried-beef/'],
  ing:{oil:15,ginger:20,garlic:20,onion:200,beef:800,spice:10,peas:300,rice:280,yoghurt:200},
  m:['Cook the rice.','Heat the oil on high. Fry the ginger and garlic 30 sec, then the finely diced onion for 1 min.','Add the mince and break it up until browned. Add garam masala, cumin, ground coriander, turmeric, chilli and salt; cook 2 min.','Add 250 ml water and the peas. Cover and simmer about 10 min until most of the water has gone.','Divide with the rice. Keep the yoghurt separate (stir in chopped mint if you have it).'],
  note:'Source: beef raised from 500 g to 800 g (5% fat), oil cut from 3 tbsp to 1, peas added.'},
 {id:32,n:'Asian beef bowls',s:4,min:20,src:['RecipeTin Eats','https://www.recipetineats.com/asian-beef-bowls/'],
  ing:{hoisin:32,oyster:64,soy:60,sugar:13,oil:20,garlic:6,onion:100,beef:800,rice:280,stirfry:600},
  m:['Cook the rice.','Mix the hoisin, oyster sauce, soy, sugar, a few drops of sesame oil and pepper.','Heat the oil on high. Cook the garlic and chopped onion 1 min.','Add the mince and break it up until no pink remains.','Add the stir-fry veg for 3–4 min, then the sauce for 2 min until it coats everything.','Divide with the rice. Top with sliced spring onion.'],
  note:'Source: beef raised from 500 g to 800 g with the sauce scaled to match; stir-fry veg added.'},
 {id:33,n:'Vietnamese caramelised chicken bowls',s:4,min:20,src:['RecipeTin Eats','https://www.recipetineats.com/vietnamese-caramelised-pork-bowls/'],
  ing:{oil:20,onion:80,ginger:10,garlic:6,chickmince:800,sugar:70,fishsauce:55,rice:280,cucumber:300,tomato:300},
  m:['Cook the rice.','Heat the oil on high. Cook the onion, ginger and garlic (and chilli if you like) 2 min.','Add the chicken mince and break it up until no longer pink.','Add the brown sugar and fish sauce. Leave it unstirred until the juices cook off and it browns, then stir. Repeat twice more.','Divide with the rice. Pack cucumber and tomato separately.'],
  note:'Source is written for pork; the author says chicken works well. Mince raised from 500 g to 800 g, sugar kept at the original amount. Chicken breast mince gives more protein.'},
 {id:34,n:'Indian chicken and lentil tray bake',s:4,min:35,src:['Heart Foundation','https://www.heartfoundation.org.au/recipes/indian-chicken-and-lentil-tray-bake'],
  ing:{oil:9,onion:150,carrot:200,chicken:800,curryp:60,capsicum:200,tomato:480,eggplant:300,zucchini:200,lentils:180,rice:200},
  m:['Heat the oven to 200°C. The source does not give a temperature.','Soften the onion and diced carrot in the oil 1–2 min. Add the chicken chunks and rogan josh paste and fry 2–3 min.','Tip into a large roasting tray with the capsicum, diced tomatoes, eggplant, zucchini, lentils and 100 ml water. Mix.','Cover tightly with foil and bake 20–25 min until the chicken is cooked through.','Cook the rice and divide.'],
  note:'Source: chicken raised from 400 g to 800 g; white rice instead of quick brown rice.'},
 {id:35,n:'Beef and rice with veggies',s:4,min:35,src:['RecipeTin Eats','https://www.recipetineats.com/ground-beef-and-rice-recipe/'],

function macros(ing){const t=[0,0,0,0];for(const k in ing){const d=ING[k],f=d[1]==='ea'?ing[k]:ing[k]/100;for(let i=0;i<4;i++)t[i]+=d[2+i]*f}return t}

const RB=Object.fromEntries(RECIPES.map(r=>[r.id,r]));

// [lunch, dinner] source per day. 'last' = the frozen portion from last week's Sunday cook; '*' = eaten from the freezer.
const SLOTS=[['last','tue'],['tue','salad'],['tue','thu'],['thu','thu'],['thu','tue*'],['sun',null],['sun','sun']];
const AISLES=['Meat & fish','Fruit & veg','Fridge','Freezer','Bakery','Tins & dry','Pantry','Not from Aldi'];
const ACT=[[1.2,'Desk job, little exercise'],[1.375,'Light: about 10,000 steps a day, or 1–3 workouts a week'],[1.55,'Moderate: active job or 3–5 workouts a week'],[1.725,'Very active: physical job and regular training']];

let S={plan:{bf:'eggs',tue:2,thu:8,sun:1,salad:22,shake:true,last:1},

const pp=r=>macros(r.ing).map(x=>x/r.s);

const line=m=>`${Math.round(m[0])} kcal · ${Math.round(m[1])} g protein · ${Math.round(m[2])} g carbs · ${Math.round(m[3])} g fat`;

/* ---------- weight log ---------- */
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const shift=(day,n)=>{const d=new Date(day+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const between=(a,b)=>S.log.filter(([d])=>d>a&&d<=b).map(x=>x[1]);
const mean=xs=>xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:null;
function wstats(){
  if(!S.log.length)return null;
  const last=S.log[S.log.length-1][0],avg7=mean(between(shift(last,-7),last)),prev7=mean(between(shift(last,-14),shift(last,-7)));
  // trend = least-squares slope over the last 21 days, only once there's enough data to mean anything
  const pts=S.log.filter(([d])=>d>shift(last,-21)).map(([d,k])=>[(new Date(d+'T12:00')-new Date(last+'T12:00'))/864e5,k]);
  let rate=null;
  if(pts.length>=8&&-pts[0][0]>=14){const mx=mean(pts.map(p=>p[0])),my=mean(pts.map(p=>p[1]));
    rate=7*pts.reduce((a,[x,y])=>a+(x-mx)*(y-my),0)/pts.reduce((a,[x])=>a+(x-mx)**2,0)}
  return {last,avg7,prev7,rate};
}
function targets(){
  const m=S.me,ws=wstats(),w=ws?ws.avg7:m.w,bmr=10*w+6.25*m.h-5*m.age+(m.sex==='m'?5:-161),tdee=bmr*m.act;
  // lose at -500/day until the 7-day average reaches goal, then maintain (small correction if it drifts 1.5 kg over)
  const base=m.reached?(w>m.goal+1.5?tdee-300:tdee):tdee-500;
  const floor=m.sex==='m'?1500:1200,kcal=Math.max(floor,Math.round((base+m.adj)/10)*10),deficit=tdee-kcal;
  return {w,bmr,tdee,kcal,protein:Math.round(1.6*w),deficit,maintain:m.reached,weeks:!m.reached&&deficit>0?(w-m.goal)*7700/(deficit*7):Infinity};
}
function base(){let t=macros(BF[S.plan.bf].ing);t=sum(t,macros(DAILY));if(S.plan.shake)t=sum(t,macros(SHAKE));return t}
function days(){
  const b=base();
  return DAYS.map((d,i)=>{const [l,dn]=SLOTS[i],L=src(l),D=dn&&src(dn);let t=sum(b,pp(L));if(D)t=sum(t,pp(D));return {d,L,D,l,dn,t}});
}
// Spare from whole packs carries into next week, except things that won't last a week once opened.
const PERISH=new Set(['lettuce','spinach','tomato','cucumber','avocado','capsicum','zucchini','cauli','eggplant','milk','yoghurt','pouch','feta','feta_rf','cottage','tofu','bread','apple','banana',

  'evap','tuna','passata','pesto','corn','beansBlack','chickpeas','lentils','coconut','dicedtom','tompaste']);
function shopping(){
  const p=S.plan,q={},add=(ing,x)=>{for(const k in ing)q[k]=(q[k]||0)+ing[k]*x};
  [p.tue,p.thu,p.sun,p.salad].forEach(id=>add(RB[id].ing,1));
  add(BF[p.bf].ing,7);add(DAILY,7);if(p.shake)add(SHAKE,7);
  let spend=0,used=0;const rows={};
  for(const k in q){const d=ING[k],have=d[10]?0:Math.min(S.stock[k]||0,q[k]),packs=Math.ceil((q[k]-have)/d[6]-1e-9),aisle=d[10]?'Pantry':d[9];
    used+=q[k]/d[6]*price(k);if(!d[10])spend+=packs*price(k);
    (rows[aisle]=rows[aisle]||[]).push({k,q:q[k],packs,have,left:(S.stock[k]||0)+packs*d[6]-q[k]});}
  return {rows,spend,used};
}
function nextWeek(){
  const sh=shopping(),stock={};
  for(const a in sh.rows)for(const r of sh.rows[a])if(!ING[r.k][10]&&!PERISH.has(r.k)&&r.left>=1)stock[r.k]=Math.round(r.left);
  for(const id of [S.plan.tue,S.plan.thu,S.plan.sun,S.plan.salad])S.picks[id]=(S.picks[id]||0)+1;
  S.stock=stock;S.plan.last=S.plan.sun;S.ticks={};
}

const ids=k=>k==='bf'?Object.keys(BF):RECIPES.filter(r=>k==='salad'?r.s===1:r.s===4).map(r=>r.id);

  const p=S.plan,t=targets(),ds=days(),avg=ds.reduce((a,x)=>sum(a,x.t),[0,0,0,0]).map(x=>x/7),sh=shopping();

  </div>

  <label class="switch" for="shake"><input type="checkbox" id="shake" ${p.shake?'checked':''}> Protein shake every day (30 g in water, ${Math.round(macros(SHAKE)[0])} kcal, ${Math.round(macros(SHAKE)[1])} g protein)</label>

  <p class="row noprint"><button class="btn" id="nextweek">Start next week</button></p>`;
}

    return `<h2>${a==='Pantry'?'Check the pantry':a}</h2><ul class="shop">${items.map(({k,q,packs,have,left})=>{const d=ING[k];
      const buy=a==='Pantry'?`Need ${amt(k,q)}${d[1]==='ea'?'':' this week'}. Buy a ${d[7]} if low.`
        :(have?`You have ${d[1]==='ea'?have:amt(k,have)} from last week. `:'')+(packs?(d[1]==='ea'&&d[6]===1?`Buy ${packs}`:`Buy ${packs} × ${d[7]}`):'Nothing to buy')+(packs&&left>0&&d[6]>1?` · ${amt(k,left)} spare${MEAT.includes(k)?', freeze it':''}`:'');
      return `<li><label for="t-${k}"><input type="checkbox" id="t-${k}" data-tick="${k}" ${S.ticks[k]?'checked':''}><span>${d[0]} <b>${d[1]==='ea'?q:amt(k,q)}</b><small>${buy}</small></span><span class="num">${a==='Pantry'?'':money(packs*price(k))}</span></label></li>`}).join('')}</ul>`};
  $('#tab-shop').innerHTML=`<h1>Tuesday shop</h1>
  <p class="sub">Everything for Tue–Mon. Till total in whole packs ≈ <b>${money(sh.spend)}</b>. Food eaten this week ≈ ${money(sh.used)} (budget ${money(+S.me.budget)}).${Object.keys(S.stock).length?' Spares from last week are already taken off.':''}</p>
  <p class="row noprint"><button class="btn ghost" id="clearticks">Clear ticks</button>${Object.keys(S.stock).length?' <button class="btn ghost" id="clearstock">Forget last week\'s spares</button>':''} <button class="btn ghost printbtn" onclick="print()">Print</button></p>
  ${AISLES.map(block).join('')}
  <p class="hint">Prices are Aldi Sydney estimates. Fix any that are wrong on the Me tab and every total updates. Tins are listed by drained weight.</p>`;
}

/* ---------- Cook ---------- */
function ingList(r){return `<ul>${Object.entries(r.ing).map(([k,q])=>`<li>${ING[k][1]==='ea'?q+' × '+ING[k][0].toLowerCase():amt(k,q)+' '+ING[k][0].toLowerCase()}</li>`).join('')}</ul>`}
function photo(id){const r=RB[id]||BF[id];return IMG[id]?`<figure class="hero"><img src="${IMG[id]}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.remove()"><figcaption>Photo: ${r.src[0]}</figcaption></figure>`:''}
function card(r,when,portion){const m=pp(r);return `<article class="card">${photo(r.id)}<h3>${r.n}</h3><p class="meta">${when} · about ${r.min} min · makes ${r.s}</p>
  <p class="macros">${line(m)} per portion</p><h4>Ingredients</h4>${ingList(r)}<h4>Method</h4><ol>${r.m.map(s=>`<li>${s}</li>`).join('')}</ol>${r.note?`<p class="note">${r.note}</p>`:''}${r.src?`<p class="note">Original recipe: <a href="${r.src[1]}" target="_blank" rel="noopener">${r.src[0]}</a></p>`:''}<p class="portion">${portion}</p></article>`}
const raw=r=>MEAT.filter(k=>r.ing[k]).map(k=>`${amt(k,r.ing[k])} ${ING[k][0].toLowerCase()}`).join(' and ');
function renderCook(){
  const tue=src('tue'),thu=src('thu'),sun=src('sun'),sal=src('salad'),b=BF[S.plan.bf];
  $('#tab-cook').innerHTML=`<h1>Cook days</h1>
  <p class="sub">Follow top to bottom through the week.</p>
  <p class="row noprint"><button class="btn ghost printbtn" onclick="print()">Print</button></p>
  <h2>Tuesday, after the shop</h2>
  ${raw(sun)?`<p class="step"><b>Freeze now:</b> ${raw(sun)} for Sunday. Label the bag.</p>`:''}
  ${raw(sal)?`<p class="step"><b>Fridge:</b> ${raw(sal)} for Wednesday's salad.</p>`:''}
  ${raw(thu)?`<p class="step"><b>Fridge:</b> ${raw(thu)} for Thursday. If its use-by date is before Thursday, freeze it and move it to the fridge Wednesday night.</p>`:''}
  ${card(tue,'Tuesday dinner time','Eat 1 tonight. Fridge 2: Wed lunch, Thu lunch. Freeze 1, labelled "Sat dinner". Add cold toppings like salsa, yoghurt or salad on the day, not before freezing.')}
  <h2>Wednesday, dinner time</h2>
  ${card(sal,'Wednesday dinner','Eat fresh. Nothing to store.')}
  <h2>Thursday, dinner time</h2>
  ${card(thu,'Thursday dinner time','Eat 1 tonight. Fridge 3: Fri lunch, Fri dinner, Sat lunch.')}
  <h2>Friday night</h2>
  <p class="step">Move the frozen "Sat dinner" portion to the fridge.</p>
  ${raw(sun)?`<h2>Saturday morning</h2><p class="step">Move the ${raw(sun)} from the freezer to the fridge for Sunday.</p>`:''}
  <h2>Sunday, lunch time</h2>
  ${card(sun,'Sunday lunch time','Eat 1 now. Fridge 2: Mon lunch, Mon dinner. Freeze 1, labelled "Tue lunch".')}
  <h2>Monday night</h2>
  <p class="step">Move the frozen "Tue lunch" portion to the fridge.</p>
  <h2>Every morning</h2>
  <article class="card">${photo(S.plan.bf)}<h3>${b.n}</h3><p class="macros">${line(macros(b.ing))}</p><ol>${b.m.map(s=>`<li>${s}</li>`).join('')}</ol></article>
  <h2>Food safety</h2>
  <ul class="hint">
   <li>Cool cooked food in shallow containers and get it in the fridge or freezer within 1 hour. Keep the fridge below 5°C.</li>
   <li>This plan eats every rice or pasta portion within 2 days of cooking. Freeze anything that will run over.</li>
   <li>Chicken and turkey: at least 74°C in the centre. Cook mince and sausages right through.</li>
   <li>Thaw in the fridge, never on the bench. Reheat until steaming hot, once only.</li>
   <li>Keep salad leaves and cold dressings out of the containers you reheat.</li>
  </ul>`;
}

/* ---------- Weight ---------- */
const dm=d=>d.slice(8)+'/'+d.slice(5,7);
const kg=x=>x==null?'–':x.toFixed(1);
const adjBtn=n=>`<button class="btn ghost" data-adj="${n}">${n<0?'Take':'Add'} ${Math.abs(n)} kcal ${n<0?'off':'to'} my target</button>`;
function chart(){
  const L=S.log.slice(-60);if(L.length<2)return '';
  const W=340,H=170,l=34,r=8,b=22,tp=8,t0=new Date(L[0][0]+'T12:00'),day=d=>(new Date(d+'T12:00')-t0)/864e5,span=Math.max(1,day(L[L.length-1][0]));
  const ys=L.map(x=>x[1]).concat(S.me.goal),lo=Math.floor(Math.min(...ys)-0.5),hi=Math.ceil(Math.max(...ys)+0.5);
  const X=d=>(l+day(d)/span*(W-l-r)).toFixed(1),Y=k=>(tp+(hi-k)/(hi-lo)*(H-b-tp)).toFixed(1);
  const avg=L.map(([d])=>`${X(d)},${Y(mean(between(shift(d,-7),d)))}`).join(' ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight over the last ${L.length} weigh-ins">
   ${[lo,hi].map(v=>`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${l-6}" y="${+Y(v)+4}" text-anchor="end">${v}</text>`).join('')}
   <line x1="${l}" x2="${W-r}" y1="${Y(S.me.goal)}" y2="${Y(S.me.goal)}" class="goal"/><text x="${W-r}" y="${+Y(S.me.goal)-4}" text-anchor="end" class="goaltxt">goal ${S.me.goal}</text>
   ${L.map(([d,k])=>`<circle cx="${X(d)}" cy="${Y(k)}" r="2.5" class="dot"/>`).join('')}
   <polyline points="${avg}" class="avg"/>
   <text x="${l}" y="${H-6}">${dm(L[0][0])}</text><text x="${W-r}" y="${H-6}" text-anchor="end">${dm(L[L.length-1][0])}</text></svg>
   <p class="hint">Dots are daily weigh-ins. The line is the 7-day average.</p>`;
}
function renderWeight(){
  const ws=wstats(),t=targets(),m=S.me,today=iso(new Date()),rate=ws&&ws.rate;
  let advice;
  if(!ws)advice='Weigh yourself each morning after the toilet and before eating. Daily weight jumps around with water and salt; the 7-day average is the number that matters.';
  else if(t.maintain){advice=`Goal reached. Your target is now maintenance, ${t.kcal} kcal a day, to keep the weight off.`;
    if(rate!=null&&rate>0.2)advice+=` You're trending up ${rate.toFixed(2)} kg a week. ${adjBtn(-150)}`;
    else if(rate!=null&&rate<-0.3)advice+=` You're still dropping ${(-rate).toFixed(2)} kg a week. ${adjBtn(150)}`;}
  else if(rate==null)advice='Keep going. After 2 weeks with at least 8 weigh-ins the app works out your trend.';
  else if(rate>-0.15)advice=`Your 3-week trend is flat (${rate>=0?'+':''}${rate.toFixed(2)} kg a week). Check portions are weighed, then if it's still flat: ${adjBtn(-150)}`;
  else if(rate<-1)advice=`You're losing ${(-rate).toFixed(2)} kg a week. That's faster than planned and risks losing muscle. ${adjBtn(150)}`;
  else advice=`On track: losing ${(-rate).toFixed(2)} kg a week.`;
  if(m.adj)advice+=` <span class="hint">Your target includes a ${m.adj>0?'+':''}${m.adj} kcal adjustment.</span> <button class="btn ghost" data-adj="reset">Remove adjustment</button>`;
  $('#tab-weight').innerHTML=`<h1>Weight</h1>
  <p class="sub">${t.maintain?'Maintenance mode: keeping you at goal.':`Losing towards ${m.goal} kg. When your 7-day average reaches it, targets switch to maintenance.`}</p>
  <div class="stats">
   <div class="stat"><b>${kg(ws&&ws.avg7)}</b><span>7-day average (kg)</span></div>
   <div class="stat"><b>${ws&&ws.prev7!=null?(ws.avg7-ws.prev7>0?'+':'')+(ws.avg7-ws.prev7).toFixed(1):'–'}</b><span>vs the week before (kg)</span></div>
   <div class="stat"><b>${rate==null?'–':(rate>0?'+':'')+rate.toFixed(2)}</b><span>trend, kg a week (3 weeks)</span></div>
   <div class="stat"><b>${ws?(t.maintain?'At goal':kg(Math.max(0,ws.avg7-m.goal))):'–'}</b><span>${t.maintain?'':'kg to go'}</span></div>
  </div>
  <div class="wform noprint"><label for="wdate" class="field"><span>Date</span><input type="date" id="wdate" value="${today}" max="${today}"></label>
   <label for="wkg" class="field"><span>Weight (kg)</span><input type="number" id="wkg" inputmode="decimal" step="0.1" min="30" max="300" placeholder="e.g. 97.4"></label>
   <button class="btn" id="wsave">Save</button></div>
  <p id="wmsg" class="hint" role="status"></p>
  <p>${advice}</p>
  ${chart()}
  ${S.log.length?`<h2>Recent weigh-ins</h2><ul class="entries">${S.log.slice(-14).reverse().map(([d,k])=>`<li><span>${dm(d)}</span><b class="num">${k.toFixed(1)} kg</b><button class="btn ghost" data-del="${d}" aria-label="Delete ${dm(d)}">Delete</button></li>`).join('')}</ul>`:''}`;
}
function saveWeight(){
  const d=$('#wdate').value,k=+$('#wkg').value;
  if(!d||!(k>=30&&k<=300)){$('#wmsg').textContent='Enter a weight between 30 and 300 kg.';return}
  S.log=S.log.filter(x=>x[0]!==d).concat([[d,Math.round(k*10)/10]]).sort((a,b)=>a[0]<b[0]?-1:1);
  const ws=wstats();if(!S.me.reached&&ws.avg7<=S.me.goal)S.me.reached=true;
  save();renderAll();$('#wmsg').textContent=`Saved ${k.toFixed(1)} kg for ${dm(d)}.`;
}

/* ---------- Me ---------- */
function renderMe(){
  const m=S.me,t=targets();
  const num=(id,label,v,step)=>`<label class="field" for="${id}"><span>${label}</span><input type="number" inputmode="decimal" id="${id}" data-me="${id}" value="${v}" step="${step||1}"></label>`;
  $('#tab-me').innerHTML=`<h1>Me and my targets</h1>
  <div id="targets"></div>
  <label class="field" for="sex"><span>Sex (for the energy formula)</span><select id="sex" data-me="sex"><option value="m"${m.sex==='m'?' selected':''}>Male</option><option value="f"${m.sex==='f'?' selected':''}>Female</option></select></label>
  ${num('age','Age',m.age)}${num('h','Height (cm)',m.h)}${num('w','Starting weight (kg), used until you log weights',m.w,0.1)}${num('goal','Goal weight (kg)',m.goal,0.1)}
  <label class="field" for="act"><span>Activity</span><select id="act" data-me="act">${ACT.map(([v,l])=>`<option value="${v}"${v==m.act?' selected':''}>${l}</option>`).join('')}</select></label>
  ${num('budget','Weekly shop budget ($)',m.budget)}
  <h2>Aldi prices</h2>
  <p class="hint">Price per pack. Change any that differ at your Aldi.</p>
  ${Object.keys(ING).map(k=>`<label class="price" for="p-${k}"><span>${ING[k][0]}<br><small class="hint">${ING[k][7]}</small></span><input type="number" inputmode="decimal" step="0.01" id="p-${k}" data-price="${k}" value="${price(k).toFixed(2)}"></label>`).join('')}
  <p class="row noprint" style="margin-top:12px"><button class="btn ghost" id="resetprices">Reset prices</button></p>
  <h2>How the numbers are worked out</h2>
  <p class="hint">Each meal's macros are added up from its ingredients by weight: meat, fish and veg raw; rice, pasta, noodles and oats dry; tins drained. Nutrition comes from USDA-style reference values per 100 g, so they are estimates. Your packet labels win, especially for sausages, tofu, yoghurt pouches and coconut milk. Oil, sauces, cheese and dressings are counted; anything extra you add is not.</p>`;
  renderTargets();
}
function renderTargets(){
  const t=targets(),m=S.me,el=$('#targets');if(!el)return;
  el.innerHTML=`<div class="stats">
   <div class="stat"><b>${t.kcal}</b><span>kcal a day target (${kj(t.kcal)} kJ)</span></div>
   <div class="stat"><b>${t.protein} g+</b><span>protein a day (1.6 g per kg)</span></div>
   <div class="stat"><b>${Math.round(t.tdee)}</b><span>kcal you burn a day, estimated</span></div>
   <div class="stat"><b>${isFinite(t.weeks)?Math.round(t.weeks):'–'}</b><span>weeks to ${m.goal} kg at about ${(t.deficit*7/7700).toFixed(2)} kg a week</span></div></div>
   <p class="hint">Mifflin-St Jeor estimate minus 500 kcal a day, which is a steady, sustainable rate. Weigh yourself at the same time each morning and go by the weekly average. If it stalls for 3 weeks, drop the activity setting one level. Recheck these numbers every 5 kg.</p>`;
}

/* ---------- wiring ---------- */
function renderAll(){renderPlan();renderWeek();renderShop();renderCook();renderWeight();renderTargets()}
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='shake'){S.plan.shake=el.checked;save();renderAll()}
  else if(el.dataset.tick){S.ticks[el.dataset.tick]=el.checked;save()}
  else if(el.dataset.price){S.prices[el.dataset.price]=el.value;save();renderAll()}
  else if(el.dataset.me){const k=el.dataset.me;S.me[k]=k==='sex'?el.value:+el.value;S.me.set=true;
    if(k==='goal'){const ws=wstats();S.me.reached=!!ws&&ws.avg7<=S.me.goal}
    save();renderAll()}
});
document.addEventListener('click',e=>{
  const t=e.target,c=t.closest('[data-choose],[data-pick],[data-close]'),d=$('#picker');
  if(t===d||(c&&'close' in c.dataset)){d.close();return}  // tap outside the list or Close
  if(c&&c.dataset.choose){openPicker(c.dataset.choose);return}
  if(c&&c.dataset.pick){const k=d.dataset.slot;S.plan[k]=k==='bf'?c.dataset.pick:+c.dataset.pick;save();d.close();renderAll();return}
  if(t.dataset.tab){document.querySelectorAll('nav button').forEach(b=>b===t?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
    document.querySelectorAll('main>section').forEach(s=>s.hidden=s.id!=='tab-'+t.dataset.tab);window.scrollTo(0,0);try{localStorage.setItem('prep-tab',t.dataset.tab)}catch(err){}}
  else if(t.id==='nextweek'){nextWeek();save();renderAll();$('#nextweek').textContent='Done. Next week started'}
  else if(t.id==='clearticks'){S.ticks={};save();renderShop()}
  else if(t.id==='clearstock'){S.stock={};save();renderAll()}
  else if(t.id==='wsave')saveWeight();
  else if(t.dataset.del){S.log=S.log.filter(x=>x[0]!==t.dataset.del);save();renderAll()}
  else if(t.dataset.adj){S.me.adj=t.dataset.adj==='reset'?0:S.me.adj+ +t.dataset.adj;save();renderAll()}
  else if(t.id==='resetprices'){S.prices={};save();renderMe();renderAll()}
});
renderMe();renderAll();
// print() is blocked inside an embedded viewer, so only show Print when running as its own page
if(window.top!==window.self)document.head.insertAdjacentHTML('beforeend','<style>.printbtn{display:none}</style>');
try{const tab=localStorage.getItem('prep-tab');if(tab)document.querySelector(`nav button[data-tab="${tab}"]`)?.click()}catch(e){}
// Home-screen apps resume rather than reload, so check for a new version each time the app comes back,
// and reload once when a new version takes over (not on the very first install).
try{if('serviceWorker' in navigator&&window.top===window.self){
  const had=!!navigator.serviceWorker.controller;let done=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!done){done=true;location.reload()}});
  navigator.serviceWorker.register('sw.js').then(reg=>document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})})).catch(()=>{});
}}catch(e){}
</script>

</body></html>
